# Levanta Jenkins en http://localhost:8080
#   cd jenkins-local && docker compose up -d --build
# Contraseña inicial:
#   docker compose exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword
services:
  jenkins:
    build: .
    container_name: jenkins-dops
    user: root            # para usar el socket de Docker Desktop (solo entorno de laboratorio)
    ports:
      - "8081:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
